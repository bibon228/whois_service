services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whois_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── WHOIS Service ───────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DSN: "postgres://postgres:postgres@db:5432/whois_db?sslmode=disable"
      JWT_SECRET: "whois-super-secret-jwt-key-2024"
      PORT: ":8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
