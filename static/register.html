<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — WHOIS Service</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card fade-in">
            <h2>🚀 Регистрация</h2>
            <p class="subtitle">Создайте аккаунт для доступа к сервису</p>

            <div class="error-message" id="errorMsg"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="username">Имя пользователя (мин. 3 символа)</label>
                    <input type="text" class="form-input" id="username" placeholder="username" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="password">Пароль (мин. 8 символов, буква + цифра)</label>
                    <input type="password" class="form-input" id="password" placeholder="••••••••" required minlength="8">
                </div>
                <div class="form-group">
                    <label class="checkbox-label" style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:0.85rem;color:var(--text-secondary);">
                        <input type="checkbox" id="acceptTerms" required style="margin-top:3px;accent-color:var(--accent-purple);width:18px;height:18px;flex-shrink:0;">
                        <span>Я согласен с <a href="#" onclick="event.stopPropagation();" style="color:var(--accent-purple);text-decoration:underline;">Политикой конфиденциальности</a> и <a href="#" onclick="event.stopPropagation();" style="color:var(--accent-purple);text-decoration:underline;">Условиями использования</a></span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">Зарегистрироваться</button>
            </form>

            <div class="auth-link">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.textContent = 'Создаём...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        accepted_terms: document.getElementById('acceptTerms').checked
                    })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.error || 'Ошибка регистрации');
                }

                // Токен теперь приходит в HttpOnly cookie автоматически
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btn.textContent = 'Зарегистрироваться';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
